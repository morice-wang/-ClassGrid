# 注意：这里绝不能加 -Dfile.encoding=UTF-8。Gradle 8.5 + JDK17 在 Windows 上把测试 worker 的
# 命令行写成 @argfile，写出用守护进程的 file.encoding，读回用系统 ANSI 编码（中文系统 GBK）；
# 两者不一致时中文项目路径被解成乱码 → 所有单测报 ClassNotFoundException: com.classgrid.app.XxxTest。
# 让守护进程保持系统默认编码即可，源码与资源都是 UTF-8，不受影响。
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 项目路径含中文（Windows 下 AGP 默认拒绝构建），按官方开关放行
android.overridePathCheck=true
kotlin.code.style=official
